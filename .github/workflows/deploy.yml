name: Build and Deploy Go Projects

on:
  push:
    paths:
      - '1/**'
      - '2/**'
      - '3/**'
      - '4/**'
      - '5/**'
      - '6/**'
      - '7/**'
      - '8/**'
      - '9/**'
      - '*/**'


jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_dirs: ${{ steps.detect.outputs.changed_dirs }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect changed directories
      id: detect
      run: |
        changed_dirs=""
        
        # Get all changed files
        if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
          # Initial commit - check all directories
          for dir in [0-9]*/; do
            if [ -d "$dir" ] && [ -f "$dir/go.mod" ]; then
              dir_name=${dir%/}
              changed_dirs="$changed_dirs $dir_name"
            fi
          done
        else
          # Compare with previous commit
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          
          # Extract unique directory names
          for file in $changed_files; do
            dir=$(echo "$file" | cut -d'/' -f1)
            if [[ $dir =~ ^[0-9]+$ ]] && [ -d "$dir" ] && [ -f "$dir/app/go.mod" ]; then
              if [[ ! " $changed_dirs " =~ " $dir " ]]; then
                changed_dirs="$changed_dirs $dir"
              fi
            fi
          done
        fi
        
        if [ -n "$changed_dirs" ]; then
          changed_dirs="${changed_dirs%,}"
          changed_dirs="[$changed_dirs]"
          echo "changed_dirs=$changed_dirs" >> $GITHUB_OUTPUT
          echo "Changed directories: $changed_dirs"
        else
          echo "changed_dirs=[]" >> $GITHUB_OUTPUT
        fi

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.changed_dirs) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Download dependencies
      run: |
        cd ${{ matrix.dir }}/app
        go mod download

    - name: Build Go project
      run: |
        cd ${{ matrix.dir }}/app
        echo "Building project in ${{ matrix.dir }}/app"
        go mod tidy
        go build -v -o app ./cmd/server
        ls -la

    - name: Create .env file
      run: |
        cd ${{ matrix.dir }}
        # Create .env file with API prefix based on directory
        cat > .env << EOF
        # Auto-generated environment configuration
        DB_DSN=${{ secrets.DB_DSN }}
        SOCKET_PATH=${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/${{ matrix.dir }}.sock
        REDIS_HOST=${{ secrets.REDIS_HOST }}
        EOF
        echo "Generated .env file for project ${{ matrix.dir }}:"

    - name: Create deployment package
      run: |
        mkdir -p deploy-${{ matrix.dir }}

        cp ${{ matrix.dir }}/app/app deploy-${{ matrix.dir }}/
        cp ${{ matrix.dir }}/.env deploy-${{ matrix.dir }}/
        
        tar -czf deploy-${{ matrix.dir }}.tar.gz -C deploy-${{ matrix.dir }} .
        echo "Archive contents:"
        tar -tzf deploy-${{ matrix.dir }}.tar.gz
        echo "Archive created: deploy-${{ matrix.dir }}.tar.gz"
        ls -lh deploy-${{ matrix.dir }}.tar.gz

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "deploy-${{ matrix.dir }}.tar.gz"
        target: "${{ secrets.REMOTE_PATH }}/"
        strip_components: 0

    - name: Deploy and run with nohup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ${{ secrets.REMOTE_PATH }}
          
          # Stop existing process and clean up socket
          if [ -f ${{ matrix.dir }}/app.pid ]; then
            pid=$(cat ${{ matrix.dir }}/app.pid)
            if kill -0 $pid 2>/dev/null; then
              echo "Stopping existing process for project ${{ matrix.dir }} (PID: $pid)"
              kill $pid
              sleep 2
            fi
          fi
          
          # Remove old socket file
          SOCKET_PATH="${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/${{ matrix.dir }}.sock"
          if [ -S "$SOCKET_PATH" ]; then
            echo "Removing old socket: $SOCKET_PATH"
            rm -f "$SOCKET_PATH"
          fi

          # Extract and deploy
          mkdir -p ${{ matrix.dir }}
          tar -xzf deploy-${{ matrix.dir }}.tar.gz -C ${{ matrix.dir }}
          rm -f deploy-${{ matrix.dir }}.tar.gz
          
          cd ${{ matrix.dir }}
          chmod +x app
          source .env
          
          echo "Starting project ${{ matrix.dir }} on Unix socket: $SOCKET_PATH"
          nohup ./app > output.log 2>&1 &
          echo $! > app.pid

          # Wait for socket to be created
          echo "Waiting for socket creation..."
          for i in {1..10}; do
            if [ -S "$SOCKET_PATH" ]; then
              echo "Socket created: $SOCKET_PATH"
              break
            fi
            sleep 1
          done
          
          if [ ! -S "$SOCKET_PATH" ]; then
            echo "Socket was not created"
            tail -20 output.log
            exit 1
          fi
          
          # Set proper permissions for nginx
          chmod 666 "$SOCKET_PATH"
          
          # Wait a moment and check if it's running
          sleep 3
          if ps -p $(cat app.pid) > /dev/null; then
            echo "Application started successfully with PID: $(cat app.pid)"
            echo "Output log: ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/output.log"
          else
            echo "Application failed to start"
            echo "=== Output log content ==="
            tail -20 output.log || echo "No output log found"
            exit 1
          fi

    - name: Verify deployment structure
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== Socket file permissions ==="
          ls -la ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/${{ matrix.dir }}.sock
          echo "=== Deployment structure for project ${{ matrix.dir }} ==="
          ls -la ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/
          echo "=== Process status ==="
          cd ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}
          if [ -f app.pid ]; then
            pid=$(cat app.pid)
            if ps -p $pid > /dev/null; then
              echo "Process running with PID: $pid"
              echo "=== Recent output ==="
              tail -20 output.log || echo "No output log yet"
            else
              echo "Process not running"
              exit 1
            fi
          else
            echo "No PID file found"
            exit 1
          fi

    - name: Clean up local files
      if: always()
      run: |
        rm -rf deploy-${{ matrix.dir }} deploy-${{ matrix.dir }}.tar.gz
        echo "Local cleanup completed"

