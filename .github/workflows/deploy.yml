name: Build and Deploy Go Projects

on:
  push:
    paths:
      - '[0-9]*/**'
      - '*/**'


jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_dirs: ${{ steps.detect.outputs.changed_dirs }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect changed directories
      id: detect
      run: |
        changed_array=()

        if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
          # Initial commit - check all directories
          for dir in [0-9]*/; do
            if [ -d "$dir" ] && [ -f "$dir/go.mod" ]; then
              dir_name=${dir%/}
              changed_array+=("$dir_name")
            fi
          done
        else
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          
          for file in $changed_files; do
            dir=$(echo "$file" | cut -d'/' -f1)
            if [[ $dir =~ ^[0-9]+$ ]] && [ -d "$dir" ] && [ -f "$dir/app/go.mod" ]; then
              changed_array+=("$dir")
            fi
          done
        fi

        # Remove duplicates using sort -u
        if [ ${#changed_array[@]} -gt 0 ]; then
          unique_changed_array=($(printf "%s\n" "${changed_array[@]}" | sort -u))
          
          json_array="["
          first=true
          for dir in "${unique_changed_array[@]}"; do
            if [ "$first" = true ]; then
              first=false
            else
              json_array="$json_array,"
            fi
            json_array="$json_array\"$dir\""
          done
          json_array="$json_array]"
          
          echo "Changed directories: $json_array"
          echo "changed_dirs=$json_array" >> $GITHUB_OUTPUT
        else
          echo "No changed directories found"
          echo "changed_dirs=[]" >> $GITHUB_OUTPUT
        fi


  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.changed_dirs) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache-dependency-path: ${{ matrix.dir }}/app/go.sum

    - name: Build Go project
      run: |
        cd ${{ matrix.dir }}/app
        echo "Building project in ${{ matrix.dir }}/app"
        go mod tidy
        go build -v -o app ./cmd/server
        ls -la

    - name: Create deployment package
      run: |
        mkdir -p deploy-${{ matrix.dir }}

        cp ${{ matrix.dir }}/app/app deploy-${{ matrix.dir }}/
        
        tar -czf deploy-${{ matrix.dir }}.tar.gz -C deploy-${{ matrix.dir }} .
        echo "Archive contents:"
        tar -tzf deploy-${{ matrix.dir }}.tar.gz
        echo "Archive created: deploy-${{ matrix.dir }}.tar.gz"
        ls -lh deploy-${{ matrix.dir }}.tar.gz

    - name: Copy archive to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "deploy-${{ matrix.dir }}.tar.gz"
        target: "${{ secrets.REMOTE_PATH }}/"
        strip_components: 0

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      env:
        SOCKET_PATH: ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/${{ matrix.dir }}.sock
        POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
        POSTGRESQL_DSN: ${{ secrets.POSTGRESQL_DSN }}
        MONGO_URL: ${{ secrets.MONGO_URL }}
        MONGO_DSN: ${{ secrets.MONGO_DSN }}
        REDIS_HOST: ${{ secrets.REDIS_HOST }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: SOCKET_PATH,POSTGRESQL_URL,POSTGRESQL_DSN,MONGO_URL,MONGO_DSN,REDIS_HOST
        script: |
          cd ${{ secrets.REMOTE_PATH }}
          
          # Stop old process
          [ -f app.pid ] && kill $(cat app.pid) 2>/dev/null || true
          [ -S "$SOCKET_PATH" ] && rm -f "$SOCKET_PATH"

          # Extract and deploy
          mkdir -p ${{ matrix.dir }}
          tar -xzf deploy-${{ matrix.dir }}.tar.gz -C ${{ matrix.dir }}
          rm -f deploy-${{ matrix.dir }}.tar.gz
          
          cd ${{ matrix.dir }}
          chmod +x app
          
          nohup ./app > output.log 2>&1 &
          echo $! > app.pid

          # Wait for socket to be created
          for i in {1..10}; do [ -S "$SOCKET_PATH" ] && break; sleep 1; done
          [ -S "$SOCKET_PATH" ] || (tail -20 output.log && exit 1)
          
          # Set proper permissions for nginx
          chmod 660 "$SOCKET_PATH"
          
          # Wait a moment and check if it's running
          sleep 3
          if ps -p $(cat app.pid) > /dev/null; then
            echo "Application started successfully with PID: $(cat app.pid)"
            echo "Output log: ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/output.log"
          else
            echo "Application failed to start"
            echo "=== Output log content ==="
            tail -20 output.log || echo "No output log found"
            exit 1
          fi

    - name: Verify deployment structure
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== Socket file permissions ==="
          ls -la ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/${{ matrix.dir }}.sock
          echo "=== Deployment structure for project ${{ matrix.dir }} ==="
          ls -la ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}/
          echo "=== Process status ==="
          cd ${{ secrets.REMOTE_PATH }}/${{ matrix.dir }}
          if [ -f app.pid ]; then
            pid=$(cat app.pid)
            if ps -p $pid > /dev/null; then
              echo "Process running with PID: $pid"
              echo "=== Recent output ==="
              tail -20 output.log || echo "No output log yet"
            else
              echo "Process not running"
              exit 1
            fi
          else
            echo "No PID file found"
            exit 1
          fi

    - name: Clean up local files
      if: always()
      run: |
        rm -rf deploy-${{ matrix.dir }} deploy-${{ matrix.dir }}.tar.gz
        echo "Local cleanup completed"

